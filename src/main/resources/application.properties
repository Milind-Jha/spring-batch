spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MongoDB configuration (stores business data)
spring.data.mongodb.uri=mongodb://localhost:27017/GplanckTestingV2

# MySQL configuration (stores Spring Batch metadata)
spring.datasource.url=jdbc:mysql://localhost:3306/springbatchdata
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.mysql.hikari.maximum-pool-size=10

### Hibernate Configuration (For MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Batch (force batch tables to use MySQL)
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false





